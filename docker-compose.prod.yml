version: '3.8'

# Production Deployment with Nginx Reverse Proxy + SSL
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  quiz-overlay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twitch-quiz-overlay
    restart: unless-stopped
    # Port 3000 nur intern, nicht nach außen exponieren
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SHARED_SECRET=${SHARED_SECRET}
    volumes:
      - ./server/state.json:/app/server/state.json
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {if(r.statusCode!==200) process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - quiz-network

  nginx:
    image: nginx:alpine
    container_name: twitch-quiz-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - quiz-overlay
    networks:
      - quiz-network

  certbot:
    image: certbot/certbot
    container_name: twitch-quiz-certbot
    # Läuft nur einmal für initiale Zertifikate, dann via cron
    entrypoint: ""
    command: >
      sh -c "certbot certonly --webroot -w /var/www/certbot
      --email ${CERTBOT_EMAIL:-admin@example.com}
      --agree-tos --no-eff-email
      -d ${DOMAIN_OVERLAY:-overlay.example.com}
      -d ${DOMAIN_CONFIG:-config.example.com}
      && cp /etc/letsencrypt/live/${DOMAIN_OVERLAY:-overlay.example.com}/fullchain.pem /etc/nginx/certs/
      && cp /etc/letsencrypt/live/${DOMAIN_OVERLAY:-overlay.example.com}/privkey.pem /etc/nginx/certs/"
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      - ./certs:/etc/nginx/certs
    networks:
      - quiz-network

networks:
  quiz-network:
    driver: bridge

volumes:
  certbot-www:
  certbot-conf: